<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Match</title>
<style>
  :root { --ink: #f6f1ff; --gold: #ffd166; --panel: #2a2150; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1a1536; }
  body { color: var(--ink); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #status { position: fixed; left: 0; right: 0; top: 80px; text-align: center; pointer-events: none; padding: 0 12px; }
  #statusText { font-weight: 800; font-size: 19px; text-shadow: 0 2px 6px #000c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { font-size: 13px; opacity: .8; min-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #net { position: fixed; bottom: max(4px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .7; pointer-events: none; }
  #toast { position: fixed; left: 50%; top: 45%; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: #000b; font-weight: 700;
           pointer-events: none; transition: opacity .4s; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0008; z-index: 30; }
  #over[hidden] { display: none; }
  .box { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; padding: 18px 20px; border-radius: 18px; background: var(--panel);
         border: 1px solid #ffffff22; text-align: center; box-shadow: 0 20px 60px #0009; }
  .box h2 { margin: 0 0 4px; font-size: 26px; } .box p { margin: 0 0 10px; opacity: .85; }
  .box h3 { margin: 8px 0 4px; font-size: 13px; color: var(--gold); text-align: left; }
  .box ol { text-align: left; margin: 0 0 10px; padding-left: 24px; font-size: 14px; min-height: 24px; } .box li span { float: right; }
  .row { display: flex; gap: 8px; align-items: center; text-align: left; font-size: 15px; padding: 3px 0; }
  .row i { width: 12px; height: 12px; border-radius: 50%; flex: none; } .row span { flex: 1; } .row b { min-width: 30px; text-align: right; }
  button { min-height: 48px; border-radius: 12px; border: 0; font: 800 16px system-ui, sans-serif; cursor: pointer; }
  .box button { width: 100%; margin-top: 8px; background: var(--gold); color: #2a1d00; }
  .hide { display: none !important; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="board"></canvas>
<div id="safe"></div>
<div id="status"><div id="statusText"></div><div id="sub"></div></div>
<div id="toast" style="opacity:0"></div>
<div id="net">Connecting…</div>
<div id="over" hidden><div class="box">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <div id="scores"></div>
  <h3>Most pairs found</h3><ol id="lb"><li>Loading…</li></ol>
  <button id="again">Play again</button>
</div></div>
<script>
/* ═══ MEMORY MATCH · a Multiplayer Agent starter ══════════════════════════════════════════
 * Flip two cards. A pair is yours and you go again; a miss passes the turn. Most pairs wins.
 * Turn-based, 1–4 players; a bot takes the empty seat when you're alone.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ board size, seats, timers, how well bots remember, the leaderboard
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   DECK .......... the seeded shuffle (same seed = same board everywhere)
 *   FACES ......... the 16 card pictures, drawn with canvas shapes
 *   GAME (HOST) ... seats, flips, pairs and misses, bots, the turn timer, results.
 *                   Only the host writes the shared `game` field.
 *   MY TURN ....... tapping a card, the flip I'm waiting on, autopilot for ?attract
 *   SCREEN ........ the card grid, flipping, the seat chips, sparkles, sounds
 *   HUD & RESULTS . status line, the results card and the leaderboard
 *   INPUT / LOOP .. taps and keys, heartbeat, color fix, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The whole game lives in ONE shared field, `game`: {id, v, ph "play"|"over", host, seed, n,
 *     seats, scores, gone, up, turn, starter, t, turnAt, turnEnds, resolveAt, seen, last,
 *     winner, endsAt}. Only the HOST writes it, and `v` goes up on every write.
 *   - The deck order is NOT in state: the host picks a `seed`, and every screen shuffles the same
 *     deck from it with a seeded random (mulberry32). `gone` marks taken cards ("." = still on the
 *     board, "a"–"d" = the seat that took it); `up` is the 0–2 cards face up right now.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It checks every flip, decides pairs and misses, plays the bots'
 *     turns and ends the game. A new host carries on from `game`: nothing else to rebuild.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `hb` (heartbeat).
 *   - Players send intents to the host: "flip" {g, t, c}, "again" {g}. `t` counts every flip,
 *     so an old or double intent is ignored. The host applies its own flips directly.
 *   - Timers are timestamps: resolveAt (two cards face up until then), turnEnds (then the host
 *     flips for you), endsAt (next game).
 *   - Bots remember cards from `seen` (the last flips, public anyway) and sometimes forget.
 *   - ?attract plays offline with bots (and your turns on autopilot) for the preview video.
 *   - Leaderboard "pairs": every pair a player finds, added up, shown after every game.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  pairs: 12,           // pairs on the board (2 to 16)
  seats: 2,            // bots fill the table up to this many players (1 to 4)
  maxSeats: 4,         // players per game; anyone else watches until the next game
  turnMs: 15000,       // time to flip before the host flips for you
  peekMs: 1100,        // two cards stay face up this long, then they match or turn back
  botMs: 750,          // how long a bot waits before each flip
  botMemory: 0.7,      // chance a bot remembers a card it saw (less for older flips)
  resultsMs: 15000,    // the results show this long, then a new game deals
  seatGraceMs: 8000,   // a player silent this long hands its seat to a bot
  board: "pairs",      // leaderboard name
  attractTaken: 1,     // ?attract: pairs already found when a game starts
};
const BOT_NAMES = ["Recall Rex", "Pixel Pip", "Flipper"];
const COLORS = ["#ff8fab", "#4cc9f0", "#ffd166", "#80ed99", "#c77dff", "#ff9f1c", "#f15bb5", "#64dfdf"];
const NAME_A = ["Happy", "Sneaky", "Lucky", "Quick", "Jolly", "Clever"], NAME_B = ["Otter", "Panda", "Fox", "Koala", "Badger", "Moose"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'memory-match',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
/** Still in the room and heard from within the seat grace time. */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── DECK ────────────────────────────────────────────────────────────────────────────
// Card i shows picture deckOf(g)[i]. The order comes from the game's seed, so it is never sent:
// every screen shuffles the same deck from the same seed.
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function seededShuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const deckMemo = { key: "", deck: [] };
function deckOf(g) {
  const key = g.seed + ":" + g.n;
  if (deckMemo.key !== key) {
    const r = mulberry32(g.seed), pics = seededShuffle(FACES.map((_, k) => k), r).slice(0, g.n / 2); // which pictures this game uses
    deckMemo.key = key; deckMemo.deck = seededShuffle([...pics, ...pics], r);
  }
  return deckMemo.deck;
}
const SEAT_MARK = "abcd"; // gone[i]: "." still on the board, or the letter of the seat that took it

// ── FACES ───────────────────────────────────────────────────────────────────────────
// Each picture is a colored shape drawn in a box from -1 to 1. Add one by adding a line here.
const TAU = Math.PI * 2;
let cx = null; // the canvas context (set in SCREEN)
const poly = (pts) => { cx.beginPath(); pts.forEach(([x, y], i) => (i ? cx.lineTo(x, y) : cx.moveTo(x, y))); cx.closePath(); };
const disc = (x, y, r) => { cx.beginPath(); cx.arc(x, y, r, 0, TAU); };
const FACES = [
  { col: "#ff9f1c", draw() { disc(0, 0, 0.36); cx.fill(); for (let k = 0; k < 8; k++) { const a = (k / 8) * TAU; cx.beginPath(); cx.moveTo(Math.cos(a) * 0.5, Math.sin(a) * 0.5); cx.lineTo(Math.cos(a) * 0.76, Math.sin(a) * 0.76); cx.stroke(); } } }, // sun
  { col: "#ef476f", draw() { cx.beginPath(); cx.moveTo(0, 0.62); cx.bezierCurveTo(-0.95, 0, -0.55, -0.8, 0, -0.32); cx.bezierCurveTo(0.55, -0.8, 0.95, 0, 0, 0.62); cx.fill(); } }, // heart
  { col: "#ffd60a", draw() { poly(Array.from({ length: 10 }, (_, k) => { const a = -Math.PI / 2 + (k * Math.PI) / 5, r = k % 2 ? 0.32 : 0.78; return [Math.cos(a) * r, Math.sin(a) * r + 0.05]; })); cx.fill(); } }, // star
  { col: "#38b000", draw() { cx.beginPath(); cx.moveTo(0, -0.78); cx.quadraticCurveTo(0.75, -0.1, 0, 0.72); cx.quadraticCurveTo(-0.75, -0.1, 0, -0.78); cx.fill(); cx.strokeStyle = "#ffffffaa"; cx.lineWidth = 0.07; cx.beginPath(); cx.moveTo(0, -0.55); cx.lineTo(0, 0.8); cx.stroke(); } }, // leaf
  { col: "#3a86ff", draw() { cx.beginPath(); cx.moveTo(0, -0.8); cx.bezierCurveTo(0.6, -0.1, 0.6, 0.66, 0, 0.66); cx.bezierCurveTo(-0.6, 0.66, -0.6, -0.1, 0, -0.8); cx.fill(); } }, // drop
  { col: "#9b8cff", draw() { cx.save(); cx.beginPath(); cx.rect(-1, -1, 2, 2); cx.arc(0.3, -0.18, 0.56, 0, TAU); cx.clip("evenodd"); disc(0, 0, 0.66); cx.fill(); cx.restore(); } }, // moon
  { col: "#f77f00", draw() { poly([[0.18, -0.82], [-0.46, 0.1], [-0.04, 0.1], [-0.2, 0.82], [0.46, -0.16], [0.04, -0.16]]); cx.fill(); } }, // bolt
  { col: "#ff5fa2", draw() { for (let k = 0; k < 5; k++) { const a = (k / 5) * TAU - Math.PI / 2; disc(Math.cos(a) * 0.38, Math.sin(a) * 0.38, 0.3); cx.fill(); } cx.fillStyle = "#ffd166"; disc(0, 0, 0.24); cx.fill(); } }, // flower
  { col: "#00b4d8", draw() { poly([[-0.66, -0.2], [-0.32, -0.62], [0.32, -0.62], [0.66, -0.2], [0, 0.72]]); cx.fill(); cx.strokeStyle = "#ffffffaa"; cx.lineWidth = 0.06; cx.beginPath(); cx.moveTo(-0.66, -0.2); cx.lineTo(0.66, -0.2); cx.moveTo(-0.2, -0.2); cx.lineTo(0, 0.7); cx.lineTo(0.2, -0.2); cx.stroke(); } }, // gem
  { col: "#2ec4b6", draw() { cx.beginPath(); cx.ellipse(-0.1, 0, 0.55, 0.36, 0, 0, TAU); cx.fill(); poly([[0.35, 0], [0.8, -0.38], [0.8, 0.38]]); cx.fill(); cx.fillStyle = "#fff"; disc(-0.36, -0.08, 0.09); cx.fill(); } }, // fish
  { col: "#e63946", draw() { cx.beginPath(); cx.arc(0, 0.05, 0.7, Math.PI, TAU); cx.closePath(); cx.fill(); cx.fillStyle = "#f4e3c1"; cx.fillRect(-0.2, 0.05, 0.4, 0.62); cx.fillStyle = "#fff"; for (const [x, y] of [[-0.35, -0.2], [0.1, -0.42], [0.38, -0.12]]) { disc(x, y, 0.11); cx.fill(); } } }, // mushroom
  { col: "#6cb4ee", draw() { disc(-0.32, 0.12, 0.3); cx.fill(); disc(0.05, -0.12, 0.4); cx.fill(); disc(0.4, 0.14, 0.28); cx.fill(); cx.fillRect(-0.32, 0.12, 0.72, 0.3); } }, // cloud
  { col: "#2d6a4f", draw() { poly([[0, -0.82], [0.55, 0.05], [-0.55, 0.05]]); cx.fill(); poly([[0, -0.45], [0.66, 0.42], [-0.66, 0.42]]); cx.fill(); cx.fillStyle = "#8d5524"; cx.fillRect(-0.12, 0.42, 0.24, 0.36); } }, // tree
  { col: "#e9b949", draw() { poly([[-0.7, 0.45], [-0.7, -0.45], [-0.35, -0.05], [0, -0.6], [0.35, -0.05], [0.7, -0.45], [0.7, 0.45]]); cx.fill(); cx.fillStyle = "#ef476f"; disc(0, 0.18, 0.12); cx.fill(); } }, // crown
  { col: "#8d99ae", draw() { cx.beginPath(); cx.arc(0, -0.1, 0.55, Math.PI, TAU); cx.lineTo(0.55, 0.65); for (let k = 0; k < 4; k++) cx.lineTo(0.55 - (k + 0.5) * 0.275, k % 2 ? 0.65 : 0.45); cx.lineTo(-0.55, 0.65); cx.closePath(); cx.fill(); cx.fillStyle = "#fff"; disc(-0.2, -0.12, 0.12); cx.fill(); disc(0.2, -0.12, 0.12); cx.fill(); } }, // ghost
  { col: "#c77dff", draw() { disc(0, 0, 0.42); cx.fill(); cx.lineWidth = 0.1; cx.beginPath(); cx.ellipse(0, 0, 0.8, 0.24, -0.4, 0, TAU); cx.stroke(); } }, // planet
];
/** One card's picture at (x, y), r = half its size. */
function paintFace(k, x, y, r) {
  const f = FACES[k % FACES.length];
  cx.save(); cx.translate(x, y); cx.scale(r, r);
  cx.fillStyle = f.col + "24"; disc(0, 0, 0.98); cx.fill();
  cx.fillStyle = f.col; cx.strokeStyle = f.col; cx.lineWidth = 0.13; cx.lineCap = "round"; cx.lineJoin = "round";
  f.draw();
  cx.restore();
}

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
const host = { last: null, inbox: [] };
const gameMemo = { raw: undefined, g: null };
/** The game as state has it, or the host's own newer write that hasn't come back yet. */
function game() {
  if (gameMemo.raw !== S.shared.game) { gameMemo.raw = S.shared.game; gameMemo.g = parse(S.shared.game, null); }
  const g = gameMemo.g;
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const seatOf = (g, id) => (g ? g.seats.findIndex((s) => s.i === id) : -1);
const playerName = (id) => (id === net.sessionId ? myName : S.entities.players[id]?.n || "Player");
const playerColor = (id) => (id === net.sessionId ? myColor : S.entities.players[id]?.c || "#ccc");
const seatName = (s) => (s.b ? s.n : playerName(s.i));
const seatColor = (s) => (s.b ? s.c : playerColor(s.i));
const onBoard = (g, c) => g.gone[c] === "." && !g.up.includes(c);

/** A new game: players who were seated keep their seats, then waiting players, then bots; a fresh seed. */
function newGame(prev) {
  const live = livePlayers(), keep = prev ? prev.seats.filter((s) => !s.b && live.includes(s.i)).map((s) => s.i) : [];
  const ids = [...keep, ...live.filter((id) => !keep.includes(id))].slice(0, CONFIG.maxSeats);
  const used = new Set(ids.map(playerColor)), seats = ids.map((id) => ({ i: id, n: playerName(id), c: playerColor(id) }));
  for (let k = 0; seats.length < Math.max(1, Math.min(CONFIG.maxSeats, CONFIG.seats)); k++) {
    const c = COLORS.find((x) => !used.has(x)) || COLORS[k]; used.add(c);
    seats.push({ i: "bot" + k, n: BOT_NAMES[k % BOT_NAMES.length], c, b: 1 });
  }
  const n = Math.max(2, Math.min(16, CONFIG.pairs)) * 2, now = Date.now(), starter = prev ? (prev.starter + 1) % seats.length : 0;
  let g = { id: (prev?.id ?? 0) + 1, ph: "play", host: net.sessionId, seed: Math.floor(Math.random() * 2 ** 31), n, seats, scores: seats.map(() => 0),
    gone: ".".repeat(n), up: [], turn: starter, starter, t: 0, turnAt: now + 900, turnEnds: now + 900 + CONFIG.turnMs, resolveAt: 0, seen: [], last: null, winner: -1, endsAt: 0 };
  if (ATTRACT) g = attractStart(g);
  return writeGame(g);
}
/** ?attract: a few pairs already taken and a few cards already seen, so the video is busy at once. */
function attractStart(g) {
  const deck = deckOf(g), gone = g.gone.split(""), scores = g.scores.slice();
  for (let k = 0; k < CONFIG.attractTaken; k++) {
    const a = gone.indexOf("."), b = deck.findIndex((f, i) => i !== a && f === deck[a] && gone[i] === "."), s = k % g.seats.length;
    gone[a] = gone[b] = SEAT_MARK[s]; scores[s]++;
  }
  const seen = gone.map((m, i) => (m === "." ? i : -1)).filter((i) => i >= 0).sort(() => Math.random() - 0.5).slice(0, 8);
  return { ...g, gone: gone.join(""), scores, seen, turnAt: Date.now() };
}
/** Seat `s` turns card `c` face up. The second card starts the peek; the host decides when it ends. */
function flip(g, s, c) {
  if (g.ph !== "play" || g.up.length >= 2 || !(c >= 0 && c < g.n) || !onBoard(g, c)) return null;
  const up = [...g.up, c], now = Date.now();
  return writeGame({ ...g, up, t: g.t + 1, turnAt: now, resolveAt: up.length === 2 ? now + CONFIG.peekMs : 0, seen: [...g.seen, c].slice(-40), last: { s, a: "flip", c, t: g.t + 1 } });
}
/** After the peek: a pair is taken and the same player goes again; a miss turns back and passes the turn. */
function resolve(g) {
  const [a, b] = g.up, s = g.turn, deck = deckOf(g), now = Date.now();
  if (deck[a] !== deck[b]) return writeGame({ ...g, up: [], turn: (s + 1) % g.seats.length, t: g.t + 1, turnAt: now, turnEnds: now + CONFIG.turnMs, last: { s, a: "miss", c: a, d: b, t: g.t + 1 } });
  const gone = g.gone.split(""); gone[a] = gone[b] = SEAT_MARK[s];
  const scores = g.scores.slice(); scores[s]++;
  const out = { ...g, gone: gone.join(""), scores, up: [], t: g.t + 1, turnAt: now, turnEnds: now + CONFIG.turnMs, last: { s, a: "pair", c: a, d: b, t: g.t + 1 } };
  if (!out.gone.includes(".")) { // the board is empty: most pairs wins, a tie wins nothing
    const top = Math.max(...scores), tops = scores.filter((x) => x === top).length;
    Object.assign(out, { ph: "over", winner: tops === 1 ? scores.indexOf(top) : -1, endsAt: now + CONFIG.resultsMs });
  }
  return writeGame(out);
}
/** Where a bot flips: a pair it remembers, the partner of the card it just turned, else a card it hasn't seen. */
function botFlip(g, s) {
  const deck = deckOf(g), open = [...Array(g.n).keys()].filter((c) => onBoard(g, c)), known = new Map(); // picture -> cards it remembers
  g.seen.slice().reverse().forEach((c, age) => {
    if (!onBoard(g, c) || Math.random() > CONFIG.botMemory * Math.pow(0.95, age)) return;
    const list = known.get(deck[c]) || []; if (!list.includes(c)) list.push(c); known.set(deck[c], list);
  });
  const remembered = new Set([...known.values()].flat()), fresh = open.filter((c) => !remembered.has(c));
  const any = (list) => list[Math.floor(Math.random() * list.length)];
  if (g.up.length === 1) {
    const mate = open.find((c) => deck[c] === deck[g.up[0]] && remembered.has(c));
    return mate !== undefined ? mate : any(fresh.length ? fresh : open);
  }
  for (const list of known.values()) if (list.length >= 2) return list[0];

function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.last = null; host.inbox.length = 0; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the table meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(); else { host.last = null; host.inbox.length = 0; }
  const g = game();
  if (g) {
    draw(g, now, dt);
    autopilot(g);
    if (now - lastHud > 100) { lastHud = now; hud(g); }
  } else { cx.setTransform(DPR, 0, 0, DPR, 0, 0); cx.fillStyle = "#1a1536"; cx.fillRect(0, 0, W, H); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  for (const type of ["flip", "again"]) net.on(type, (data, from) => { if (isHost() && data) host.inbox.push({ type, from, data }); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") lb = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || pickOne(COLORS);
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
